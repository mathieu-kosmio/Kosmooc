<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" width="800" height="384" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">La grille E-T-S-C</title><desc id="d">Entrée, Transformation et Sortie se suivent ; la case Contrôle les surveille toutes trois.</desc>
<rect width="800" height="384" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">LA GRILLE E-T-S-C</text>
<rect x="40" y="70" width="200" height="140" rx="12" fill="#FFFFFF" stroke="#7C9E98" stroke-width="2"/>
<circle cx="74" cy="104" r="20" fill="#7C9E98"/><text x="74" y="111" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700" >E</text>
<text x="104" y="110" font-size="16" fill="#1F2D3D" text-anchor="start" font-weight="700" >Entrée</text>
<text x="140" y="148" font-size="13" fill="#5D6C73" text-anchor="middle" font-weight="400" >Quels documents ?</text>
<rect x="54" y="162" width="172" height="32" rx="8" fill="#EEF3F2"/><text x="140" y="183" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" font-style="italic">Le devis accepté</text>
<path d="M244 140 L294 140" stroke="#3B4B5E" stroke-width="3"/><path d="M285.9 143.9 L294 140 L285.9 136.1" fill="none" stroke="#3B4B5E" stroke-width="3" stroke-linejoin="round"/>
<rect x="300" y="70" width="200" height="140" rx="12" fill="#FFFFFF" stroke="#00B194" stroke-width="2"/>
<circle cx="334" cy="104" r="20" fill="#00B194"/><text x="334" y="111" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700" >T</text>
<text x="364" y="110" font-size="16" fill="#1F2D3D" text-anchor="start" font-weight="700" >Transformation</text>
<text x="400" y="148" font-size="13" fill="#5D6C73" text-anchor="middle" font-weight="400" >Que faut-il en tirer ?</text>
<rect x="314" y="162" width="172" height="32" rx="8" fill="#E6F7F4"/><text x="400" y="183" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" font-style="italic">Les lignes à produire</text>
<path d="M504 140 L554 140" stroke="#3B4B5E" stroke-width="3"/><path d="M545.9 143.9 L554 140 L545.9 136.1" fill="none" stroke="#3B4B5E" stroke-width="3" stroke-linejoin="round"/>
<rect x="560" y="70" width="200" height="140" rx="12" fill="#FFFFFF" stroke="#009982" stroke-width="2"/>
<circle cx="594" cy="104" r="20" fill="#009982"/><text x="594" y="111" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700" >S</text>
<text x="624" y="110" font-size="16" fill="#1F2D3D" text-anchor="start" font-weight="700" >Sortie</text>
<text x="660" y="148" font-size="13" fill="#5D6C73" text-anchor="middle" font-weight="400" >Quel résultat ?</text>
<rect x="574" y="162" width="172" height="32" rx="8" fill="#E6F7F4"/><text x="660" y="183" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" font-style="italic">La fiche de production</text>
<rect x="140" y="250" width="520" height="84" rx="12" fill="#F8EFE2" stroke="#BA8748" stroke-width="2.5"/>
<circle cx="176" cy="292" r="20" fill="#BA8748"/><text x="176" y="299" font-size="20" fill="#FFFFFF" text-anchor="middle" font-weight="700" >C</text>
<text x="206" y="284" font-size="15" fill="#1F2D3D" text-anchor="start" font-weight="700" >Contrôle : ce qu'un humain doit vérifier</text>
<text x="206" y="306" font-size="12.5" fill="#3B4B5E" text-anchor="start" font-weight="400" >Dimensions, essences, quantités, délais, informations manquantes</text>
<path d="M140 214 L230 246" stroke="#BA8748" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M221.1 247.0 L230 246 L223.7 239.6" fill="none" stroke="#BA8748" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M400 214 L400 246" stroke="#BA8748" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M396.1 237.9 L400 246 L403.9 237.9" fill="none" stroke="#BA8748" stroke-width="2.5" stroke-linejoin="round"/>
<path d="M660 214 L570 246" stroke="#BA8748" stroke-width="2.5" stroke-dasharray="5 5"/><path d="M576.3 239.6 L570 246 L578.9 247.0" fill="none" stroke="#BA8748" stroke-width="2.5" stroke-linejoin="round"/>
<text x="400" y="364" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >La case que l'on oublie, et celle qui sépare un outil utile d'un outil dangereux.</text>
