<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 384" width="800" height="384" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Trois niveaux d’outil</title><desc id="d">Un escalier : conversation seule, conversation dans un projet, procédure réutilisable.</desc>
<rect width="800" height="384" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">TROIS NIVEAUX D'OUTIL</text>
<rect x="30" y="230" width="240" height="100" rx="10" fill="#EEF3F2" stroke="#7C9E98" stroke-width="2"/>
<circle cx="58" cy="260" r="16" fill="#7C9E98"/><text x="58" y="266" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" >1</text>
<text x="82" y="258" font-size="14" fill="#1F2D3D" text-anchor="start" font-weight="700" >Conversation seule</text>
<text x="82" y="278" font-size="11.5" fill="#3B4B5E" text-anchor="start" font-weight="400" >Une demande ponctuelle</text>
<text x="82" y="300" font-size="11" fill="#7C9E98" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">MODULE 2</text>
<rect x="278" y="170" width="240" height="160" rx="10" fill="#E6F7F4" stroke="#00B194" stroke-width="2"/>
<circle cx="306" cy="200" r="16" fill="#00B194"/><text x="306" y="206" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" >2</text>
<text x="330" y="198" font-size="14" fill="#1F2D3D" text-anchor="start" font-weight="700" >Projet</text>
<text x="330" y="218" font-size="11.5" fill="#3B4B5E" text-anchor="start" font-weight="400" >Documents + instructions</text>
<text x="330" y="240" font-size="11" fill="#00B194" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">MODULE 5</text>
<rect x="526" y="110" width="240" height="220" rx="10" fill="#E6F7F4" stroke="#009982" stroke-width="2"/>
<circle cx="554" cy="140" r="16" fill="#009982"/><text x="554" y="146" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" >3</text>
<text x="578" y="138" font-size="14" fill="#1F2D3D" text-anchor="start" font-weight="700" >Procédure réutilisable</text>
<text x="578" y="158" font-size="11.5" fill="#3B4B5E" text-anchor="start" font-weight="400" >Se rejoue, se partage</text>
<text x="578" y="180" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">MODULE 6</text>
<text x="400" y="362" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >On monte d'une marche seulement quand la tâche se répète.</text>
</svg>