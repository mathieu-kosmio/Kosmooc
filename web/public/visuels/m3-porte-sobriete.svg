<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">La porte de sobriété</title><desc id="d">Quatre questions dans l’ordre : faut-il automatiser, faut-il de l’IA, quelle IA, quel niveau d’autonomie. Chaque question a une sortie sans IA ou modeste.</desc>
<rect width="800" height="340" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">LA PORTE DE SOBRIÉTÉ</text>
<rect x="40" y="86" width="156" height="96" rx="10" fill="#FFFFFF" stroke="#1F2D3D" stroke-width="2"/>
<circle cx="62" cy="108" r="13" fill="#1F2D3D"/><text x="62" y="113" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" >1</text>
<text x="128.0" y="140" font-size="13.5" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Faut-il automatiser</text><text x="128.0" y="158" font-size="13.5" fill="#1F2D3D" text-anchor="middle" font-weight="700" >ce processus ?</text>
<path d="M196 134 H228" stroke="#00B194" stroke-width="3"/><path d="M220 127 l8 7 -8 7" fill="none" stroke="#00B194" stroke-width="3"/><text x="212.0" y="124" font-size="11" fill="#009982" text-anchor="middle" font-weight="700" >Oui</text>
<path d="M118.0 182 V222" stroke="#BA8748" stroke-width="3" stroke-dasharray="5 5"/>
<text x="124.0" y="206" font-size="11" fill="#BA8748" text-anchor="start" font-weight="700" >Non</text>
<rect x="40" y="226" width="156" height="56" rx="10" fill="#F8EFE2" stroke="#BA8748"/>
<text x="118.0" y="250" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Supprimer, simplifier,</text><text x="118.0" y="268" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" >faire moins souvent</text>
<rect x="228" y="86" width="156" height="96" rx="10" fill="#FFFFFF" stroke="#1F2D3D" stroke-width="2"/>
<circle cx="250" cy="108" r="13" fill="#1F2D3D"/><text x="250" y="113" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" >2</text>
<text x="316.0" y="140" font-size="13.5" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Faut-il de l'IA</text><text x="316.0" y="158" font-size="13.5" fill="#1F2D3D" text-anchor="middle" font-weight="700" >pour l'automatiser ?</text>
<path d="M384 134 H416" stroke="#00B194" stroke-width="3"/><path d="M408 127 l8 7 -8 7" fill="none" stroke="#00B194" stroke-width="3"/><text x="400.0" y="124" font-size="11" fill="#009982" text-anchor="middle" font-weight="700" >Oui</text>
<path d="M306.0 182 V222" stroke="#BA8748" stroke-width="3" stroke-dasharray="5 5"/>
<text x="312.0" y="206" font-size="11" fill="#BA8748" text-anchor="start" font-weight="700" >Non</text>
<rect x="228" y="226" width="156" height="56" rx="10" fill="#F8EFE2" stroke="#BA8748"/>
<text x="306.0" y="250" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Une règle, un tableur,</text><text x="306.0" y="268" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" >une fonction déjà payée</text>
<rect x="416" y="86" width="156" height="96" rx="10" fill="#FFFFFF" stroke="#1F2D3D" stroke-width="2"/>
<circle cx="438" cy="108" r="13" fill="#1F2D3D"/><text x="438" y="113" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" >3</text>
<text x="504.0" y="140" font-size="13.5" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Quelle IA ?</text><text x="504.0" y="158" font-size="13.5" fill="#1F2D3D" text-anchor="middle" font-weight="700" ></text>
<path d="M572 134 H604" stroke="#00B194" stroke-width="3"/><path d="M596 127 l8 7 -8 7" fill="none" stroke="#00B194" stroke-width="3"/><text x="588.0" y="124" font-size="11" fill="#009982" text-anchor="middle" font-weight="700" >Oui</text>
<path d="M494.0 182 V222" stroke="#00B194" stroke-width="3" stroke-dasharray="0"/>
<text x="500.0" y="206" font-size="11" fill="#00B194" text-anchor="start" font-weight="700" >La plus modeste</text>
<rect x="416" y="226" width="156" height="56" rx="10" fill="#E6F7F4" stroke="#00B194"/>
<text x="494.0" y="250" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Brique déjà présente,</text><text x="494.0" y="268" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" >puis modèle généraliste</text>
<rect x="604" y="86" width="156" height="96" rx="10" fill="#FFFFFF" stroke="#1F2D3D" stroke-width="2"/>
<circle cx="626" cy="108" r="13" fill="#1F2D3D"/><text x="626" y="113" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" >4</text>
<text x="692.0" y="140" font-size="13.5" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Quel niveau</text><text x="692.0" y="158" font-size="13.5" fill="#1F2D3D" text-anchor="middle" font-weight="700" >d'autonomie ?</text>
<path d="M682.0 182 V222" stroke="#00B194" stroke-width="3" stroke-dasharray="0"/>
<text x="688.0" y="206" font-size="11" fill="#00B194" text-anchor="start" font-weight="700" >Pour un 1er cas</text>
<rect x="604" y="226" width="156" height="56" rx="10" fill="#E6F7F4" stroke="#00B194"/>
<text x="682.0" y="250" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Suggestion</text><text x="682.0" y="268" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="400" >ou copilote</text>
<text x="400" y="318" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Écarter une tâche, avec son motif, est un résultat à part entière.</text>
</svg>