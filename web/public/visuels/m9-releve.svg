<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 356" width="800" height="356" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Du relevé à la décision</title><desc id="d">Une frise du module 0 au module 9 : le relevé démarre au M0, s’enrichit à chaque occurrence, alimente le point de départ mesuré au M9, puis un plan de mesure sur quatre semaines. Mesuré et estimé sont acceptés, un gain non mesuré est refusé.</desc>
<rect width="800" height="356" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">DU RELEVÉ À LA DÉCISION</text>
<path d="M50 170 H750" stroke="#C9BFB1" stroke-width="4" stroke-linecap="round"/>
<circle cx="70" cy="170" r="11" fill="#BA8748"/>
<text x="70" y="202" font-size="11" fill="#BA8748" text-anchor="middle" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">M0</text><text x="70" y="224" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Relevé ouvert</text>
<circle cx="250" cy="170" r="11" fill="#7C9E98"/>
<text x="250" y="202" font-size="11" fill="#7C9E98" text-anchor="middle" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">M2 à M5</text><text x="250" y="224" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Une ligne par occurrence</text>
<circle cx="430" cy="170" r="11" fill="#00B194"/>
<text x="430" y="202" font-size="11" fill="#00B194" text-anchor="middle" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">M6</text><text x="430" y="224" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Test décisif</text>
<circle cx="592" cy="170" r="11" fill="#009982"/>
<text x="592" y="202" font-size="11" fill="#009982" text-anchor="middle" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">M9</text><text x="592" y="224" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Point de départ mesuré</text>
<circle cx="730" cy="170" r="11" fill="#9F7338"/>
<text x="730" y="202" font-size="11" fill="#9F7338" text-anchor="middle" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">+4 SEM.</text><text x="730" y="224" font-size="12.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Plan de mesure</text>
<rect x="104" y="136" width="18" height="14" rx="3" fill="#EEF3F2" stroke="#7C9E98"/>
<rect x="138" y="122" width="18" height="28" rx="3" fill="#EEF3F2" stroke="#7C9E98"/>
<rect x="172" y="131" width="18" height="19" rx="3" fill="#EEF3F2" stroke="#7C9E98"/>
<rect x="206" y="117" width="18" height="33" rx="3" fill="#EEF3F2" stroke="#7C9E98"/>
<rect x="240" y="126" width="18" height="24" rx="3" fill="#EEF3F2" stroke="#7C9E98"/>
<rect x="274" y="135" width="18" height="15" rx="3" fill="#EEF3F2" stroke="#7C9E98"/>
<rect x="308" y="121" width="18" height="29" rx="3" fill="#EEF3F2" stroke="#7C9E98"/>
<rect x="342" y="130" width="18" height="20" rx="3" fill="#EEF3F2" stroke="#7C9E98"/>
