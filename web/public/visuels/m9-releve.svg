<text x="104" y="96" font-size="12" fill="#5D6C73" text-anchor="start" font-weight="400" >Chaque barre : une occurrence de la tâche, chronométrée</text>
<rect x="60" y="250" width="680" height="86" rx="12" fill="#FFFFFF" stroke="#C9BFB1"/>
