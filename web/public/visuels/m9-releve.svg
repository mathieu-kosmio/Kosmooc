<text x="178" y="322" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >accepté</text>
<rect x="302" y="270" width="196" height="30" rx="15" fill="#F8EFE2" stroke="#BA8748"/><text x="400" y="290" font-size="12.5" fill="#BA8748" text-anchor="middle" font-weight="700" >Estimé</text>
