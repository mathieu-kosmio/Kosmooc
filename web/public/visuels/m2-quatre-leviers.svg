<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Les quatre leviers d’une demande</title><desc id="d">Contexte plus objectif plus contraintes plus format, avec un exemple pour chacun tiré du cas devis vers fiche de production.</desc>
<rect width="800" height="320" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">UNE DEMANDE EXPLOITABLE</text>
<rect x="32" y="70" width="170" height="190" rx="12" fill="#FFFFFF" stroke="#7C9E98" stroke-width="2"/>
<rect x="32" y="70" width="170" height="44" rx="12" fill="#7C9E98"/><rect x="32" y="100" width="170" height="14" fill="#7C9E98"/>
<text x="117.0" y="98" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Contexte</text>
<text x="117.0" y="140" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="600" >De quoi parle-t-on ?</text>
<rect x="44" y="158" width="146" height="62" rx="8" fill="#EEF3F2"/>
<text x="117.0" y="184" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" font-style="italic">« Scierie, préparation de</text><text x="117.0" y="202" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" font-style="italic">production. Devis joint. »</text>
<text x="117.0" y="246" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >Le vocabulaire</text>
<text x="215.0" y="170" font-size="26" fill="#5D6C73" text-anchor="middle" font-weight="700" >+</text>
<rect x="228" y="70" width="170" height="190" rx="12" fill="#FFFFFF" stroke="#00B194" stroke-width="2"/>
<rect x="228" y="70" width="170" height="44" rx="12" fill="#00B194"/><rect x="228" y="100" width="170" height="14" fill="#00B194"/>
<text x="313.0" y="98" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Objectif</text>
<text x="313.0" y="140" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Quel résultat concret ?</text>
<rect x="240" y="158" width="146" height="62" rx="8" fill="#E6F7F4"/>
<text x="313.0" y="184" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" font-style="italic">« Produis la fiche qui</text><text x="313.0" y="202" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" font-style="italic">lance le débit. »</text>
<text x="313.0" y="246" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >La destination</text>
<text x="411.0" y="170" font-size="26" fill="#5D6C73" text-anchor="middle" font-weight="700" >+</text>
<rect x="424" y="70" width="170" height="190" rx="12" fill="#FFFFFF" stroke="#BA8748" stroke-width="2"/>
<rect x="424" y="70" width="170" height="44" rx="12" fill="#BA8748"/><rect x="424" y="100" width="170" height="14" fill="#BA8748"/>
<text x="509.0" y="98" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Contraintes</text>
<text x="509.0" y="140" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Quelles règles ?</text>
<rect x="436" y="158" width="146" height="62" rx="8" fill="#F8EFE2"/>
<text x="509.0" y="184" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" font-style="italic">« N'invente rien. Garde</text><text x="509.0" y="202" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" font-style="italic">les unités. Pas de prix. »</text>
<text x="509.0" y="246" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >Les garde-fous</text>
<text x="607.0" y="170" font-size="26" fill="#5D6C73" text-anchor="middle" font-weight="700" >+</text>
<rect x="620" y="70" width="170" height="190" rx="12" fill="#FFFFFF" stroke="#65857F" stroke-width="2"/>
<rect x="620" y="70" width="170" height="44" rx="12" fill="#65857F"/><rect x="620" y="100" width="170" height="14" fill="#65857F"/>
<text x="705.0" y="98" font-size="16" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Format</text>
<text x="705.0" y="140" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Quelle forme de sortie ?</text>
<rect x="632" y="158" width="146" height="62" rx="8" fill="#EEF3F2"/>
<text x="705.0" y="184" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" font-style="italic">« Un tableau : repère,</text><text x="705.0" y="202" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" font-style="italic">essence, section… »</text>
<text x="705.0" y="246" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >La comparabilité</text>
<text x="400" y="296" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Le levier le plus sous-utilisé : les contraintes. Ce sont elles qui rendent la réponse fiable.</text>
</svg>