<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Modèle et agent</title><desc id="d">À gauche, le modèle reçoit une demande et produit une réponse. À droite, l’agent reçoit un objectif, des documents et des règles, et enchaîne lire, extraire, remplir, vérifier.</desc>
<rect width="800" height="330" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">MODÈLE OU AGENT</text>
<rect x="32" y="62" width="340" height="250" rx="12" fill="#FFFFFF" stroke="#C9BFB1"/>
<text x="202" y="92" font-size="17" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Le modèle</text>
<text x="202" y="114" font-size="13" fill="#5D6C73" text-anchor="middle" font-weight="400" >une demande, une réponse</text>
<rect x="62" y="150" width="96" height="60" rx="8" fill="#EEF3F2" stroke="#7C9E98"/><text x="110" y="177" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Votre</text><text x="110" y="194" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="400" >demande</text>
<circle cx="202" cy="180" r="30" fill="#00B194"/><text x="202" y="185" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" >IA</text>
<rect x="246" y="150" width="96" height="60" rx="8" fill="#E6F7F4" stroke="#00B194"/><text x="294" y="177" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Une</text><text x="294" y="194" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="400" >réponse</text>
<path d="M160 180 H168 M236 180 H242" stroke="#3B4B5E" stroke-width="2"/><path d="M166 174 l6 6 -6 6 M240 174 l6 6 -6 6" fill="none" stroke="#3B4B5E" stroke-width="2"/>
<text x="202" y="256" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Utile pour reformuler, résumer,</text><text x="202" y="274" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >extraire, rédiger.</text>
<rect x="400" y="62" width="368" height="250" rx="12" fill="#FFFFFF" stroke="#C9BFB1"/>
<text x="584" y="92" font-size="17" fill="#1F2D3D" text-anchor="middle" font-weight="700" >L'agent</text>
<text x="584" y="114" font-size="13" fill="#5D6C73" text-anchor="middle" font-weight="400" >un objectif, des ressources, des règles</text>
<circle cx="588" cy="200" r="56" fill="none" stroke="#00B194" stroke-width="2.5" stroke-dasharray="6 6"/>
<circle cx="588" cy="200" r="22" fill="#00B194"/><text x="588" y="205" font-size="14" fill="#FFFFFF" text-anchor="middle" font-weight="700" >IA</text>
<rect x="550.0" y="131.0" width="76" height="26" rx="13" fill="#E6F7F4" stroke="#00B194"/><text x="588.0" y="149.0" font-size="12" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Lire</text>
<rect x="606.0" y="187.0" width="76" height="26" rx="13" fill="#E6F7F4" stroke="#00B194"/><text x="644.0" y="205.0" font-size="12" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Extraire</text>
<rect x="550.0" y="243.0" width="76" height="26" rx="13" fill="#E6F7F4" stroke="#00B194"/><text x="588.0" y="261.0" font-size="12" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Remplir</text>
<rect x="494.0" y="187.0" width="76" height="26" rx="13" fill="#E6F7F4" stroke="#00B194"/><text x="532.0" y="205.0" font-size="12" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Vérifier</text>
<rect x="414" y="164" width="56" height="72" rx="6" fill="#EEF3F2" stroke="#7C9E98"/><text x="442" y="192" font-size="11" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Devis</text><text x="442" y="207" font-size="11" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Gabarit</text><text x="442" y="222" font-size="11" fill="#1F2D3D" text-anchor="middle" font-weight="400" >Règles</text>
<text x="726" y="196" font-size="12" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Fiche</text><text x="726" y="212" font-size="12" fill="#1F2D3D" text-anchor="middle" font-weight="400" >+ manques</text>
<text x="584" y="296" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Plus d'autonomie demande plus de règles et de contrôle.</text>
</svg>