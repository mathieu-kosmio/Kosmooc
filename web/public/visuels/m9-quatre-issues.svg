<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Quatre issues</title><desc id="d">Après la mesure : abandonner, améliorer, observer en parallèle ou déployer.</desc>
<rect width="800" height="350" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">QUATRE ISSUES APRÈS LA MESURE</text>
<rect x="300" y="64" width="200" height="56" rx="28" fill="#1F2D3D"/><text x="400" y="98" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Après la mesure</text>
<path d="M400 120 C400 150 112 140 112 168" fill="none" stroke="#8A1F1F" stroke-width="2.5"/>
<rect x="24" y="170" width="176" height="130" rx="12" fill="#FDECEC" stroke="#8A1F1F" stroke-width="2"/>
<text x="112" y="198" font-size="16" fill="#8A1F1F" text-anchor="middle" font-weight="700" >Abandonner</text><text x="112" y="226" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Trop d'erreurs, ou contrôle</text><text x="112" y="242" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >plus cher que la tâche</text><text x="112" y="278" font-size="11.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Une réussite si motivée</text>
<path d="M400 120 C400 150 304 140 304 168" fill="none" stroke="#BA8748" stroke-width="2.5"/>
<rect x="216" y="170" width="176" height="130" rx="12" fill="#F8EFE2" stroke="#BA8748" stroke-width="2"/>
<text x="304" y="198" font-size="16" fill="#BA8748" text-anchor="middle" font-weight="700" >Améliorer</text><text x="304" y="226" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Les écarts viennent de</text><text x="304" y="242" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >règles manquantes</text><text x="304" y="278" font-size="11.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Retour à la boucle 5</text>
<path d="M400 120 C400 150 496 140 496 168" fill="none" stroke="#7C9E98" stroke-width="2.5"/>
<rect x="408" y="170" width="176" height="130" rx="12" fill="#EEF3F2" stroke="#7C9E98" stroke-width="2"/>
<text x="496" y="198" font-size="16" fill="#7C9E98" text-anchor="middle" font-weight="700" >Observer</text><text x="496" y="226" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Prometteur : 2 à 4 semaines</text><text x="496" y="242" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >en parallèle</text><text x="496" y="278" font-size="11.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >L'outil propose, ne décide pas</text>
<path d="M400 120 C400 150 688 140 688 168" fill="none" stroke="#00B194" stroke-width="2.5"/>
<rect x="600" y="170" width="176" height="130" rx="12" fill="#E6F7F4" stroke="#00B194" stroke-width="2"/>
<text x="688" y="198" font-size="16" fill="#00B194" text-anchor="middle" font-weight="700" >Déployer</text><text x="688" y="226" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Propriétaire métier, journal,</text><text x="688" y="242" font-size="11.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >revue régulière</text><text x="688" y="278" font-size="11.5" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Le contrôle humain reste</text>
<text x="400" y="330" font-size="12.5" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Un prototype concluant est un candidat à l'industrialisation, jamais automatiquement un outil de production.</text>
</svg>