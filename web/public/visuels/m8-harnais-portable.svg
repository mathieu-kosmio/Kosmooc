<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 364" width="800" height="364" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Le harnais se transporte</title><desc id="d">Une valise contenant le prompt métier, les règles, les cas de test, la charte et le journal passe de l’outil A à l’outil B.</desc>
<rect width="800" height="364" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">CE QUI SE TRANSPORTE</text>
<rect x="40" y="90" width="200" height="190" rx="12" fill="#FFFFFF" stroke="#C9BFB1" stroke-width="2"/><text x="140" y="120" font-size="16" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Outil A</text><text x="140" y="140" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >aujourd'hui</text>
<rect x="560" y="90" width="200" height="190" rx="12" fill="#FFFFFF" stroke="#C9BFB1" stroke-width="2" stroke-dasharray="6 5"/><text x="660" y="120" font-size="16" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Outil B</text><text x="660" y="140" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >demain, si besoin</text>
<circle cx="140" cy="200" r="36" fill="#EEF3F2" stroke="#7C9E98"/><text x="140" y="205" font-size="12" fill="#3B4B5E" text-anchor="middle" font-weight="400" >modèle A</text>
<circle cx="660" cy="200" r="36" fill="#EEF3F2" stroke="#7C9E98"/><text x="660" y="205" font-size="12" fill="#3B4B5E" text-anchor="middle" font-weight="400" >modèle B</text>
<rect x="370" y="112" width="60" height="26" rx="8" fill="none" stroke="#9F7338" stroke-width="5"/>
<rect x="300" y="130" width="200" height="150" rx="14" fill="#BA8748"/>
<text x="400" y="162" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Prompt métier</text>
<text x="400" y="186" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Règles et gabarits</text>
<text x="400" y="210" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Cas de test</text>
<text x="400" y="234" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Charte</text>
<text x="400" y="258" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="600" >Journal des corrections</text>
<path d="M246 205 L296 205" stroke="#3B4B5E" stroke-width="2.5"/><path d="M287.9 208.9 L296 205 L287.9 201.1" fill="none" stroke="#3B4B5E" stroke-width="2.5" stroke-linejoin="round"/><path d="M504 205 L554 205" stroke="#3B4B5E" stroke-width="2.5" stroke-dasharray="5 4"/><path d="M545.9 208.9 L554 205 L545.9 201.1" fill="none" stroke="#3B4B5E" stroke-width="2.5" stroke-linejoin="round"/>
<text x="400" y="318" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >Des fichiers texte à vous : changer d'outil revient à les recoller et à rejouer vos cas de test.</text>
<text x="400" y="340" font-size="13" fill="#8A1F1F" text-anchor="middle" font-weight="400" >Ce qui reste coincé : un assistant configuré seulement dans l'interface d'un fournisseur.</text>
</svg>