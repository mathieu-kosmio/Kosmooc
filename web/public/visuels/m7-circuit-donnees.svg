<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 416" width="800" height="416" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Le circuit des données</title><desc id="d">Le document part de votre poste, chiffré, vers les serveurs du fournisseur où le modèle est figé, puis la réponse revient. Sur votre compte, trois réglages à vérifier : historique, mémoire, entraînement.</desc>
<rect width="800" height="416" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">OÙ VONT VOS DONNÉES</text>
<rect x="40" y="90" width="170" height="110" rx="12" fill="#FFFFFF" stroke="#7C9E98" stroke-width="2"/><text x="125" y="124" font-size="15" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Votre poste</text><text x="125" y="146" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >document + consigne</text><text x="125" y="166" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >anonymisés si besoin</text>
<rect x="315" y="70" width="230" height="150" rx="12" fill="#FFFFFF" stroke="#00B194" stroke-width="2"/><text x="430" y="100" font-size="15" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Serveurs du fournisseur</text>
<circle cx="430" cy="150" r="34" fill="#00B194"/><text x="430" y="146" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Modèle</text><text x="430" y="162" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="400" >figé</text>
<text x="430" y="206" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >il n'apprend pas en direct</text>
<rect x="640" y="90" width="130" height="110" rx="12" fill="#FFFFFF" stroke="#7C9E98" stroke-width="2"/><text x="705" y="140" font-size="15" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Réponse</text><text x="705" y="162" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >sur votre écran</text>
<path d="M214 130 L311 130" stroke="#3B4B5E" stroke-width="2.5"/><path d="M302.9 133.9 L311 130 L302.9 126.1" fill="none" stroke="#3B4B5E" stroke-width="2.5" stroke-linejoin="round"/><text x="262" y="120" font-size="11" fill="#5D6C73" text-anchor="middle" font-weight="400" >chiffré</text>
<path d="M549 150 L636 150" stroke="#3B4B5E" stroke-width="2.5"/><path d="M627.9 153.9 L636 150 L627.9 146.1" fill="none" stroke="#3B4B5E" stroke-width="2.5" stroke-linejoin="round"/>
<rect x="140" y="250" width="520" height="120" rx="12" fill="#F8EFE2" stroke="#BA8748" stroke-width="2" stroke-dasharray="6 5"/>
<text x="400" y="278" font-size="14" fill="#9F7338" text-anchor="middle" font-weight="700" >Ce que l'outil peut garder sur votre compte : à vérifier</text>
<rect x="156" y="296" width="158" height="58" rx="8" fill="#FFFFFF" stroke="#BA8748"/>
<rect x="168" y="310" width="30" height="16" rx="8" fill="#C9BFB1"/><circle cx="176" cy="318" r="6" fill="#FFFFFF"/>
<text x="206" y="323" font-size="13" fill="#1F2D3D" text-anchor="start" font-weight="700" >Historique</text><text x="235" y="344" font-size="11" fill="#5D6C73" text-anchor="middle" font-weight="400" >conservé combien de temps ?</text>
<rect x="322" y="296" width="158" height="58" rx="8" fill="#FFFFFF" stroke="#BA8748"/>
<rect x="334" y="310" width="30" height="16" rx="8" fill="#C9BFB1"/><circle cx="342" cy="318" r="6" fill="#FFFFFF"/>
<text x="372" y="323" font-size="13" fill="#1F2D3D" text-anchor="start" font-weight="700" >Mémoire</text><text x="401" y="344" font-size="11" fill="#5D6C73" text-anchor="middle" font-weight="400" >se souvient de vous ?</text>
<rect x="488" y="296" width="158" height="58" rx="8" fill="#FFFFFF" stroke="#BA8748"/>
<rect x="500" y="310" width="30" height="16" rx="8" fill="#C9BFB1"/><circle cx="508" cy="318" r="6" fill="#FFFFFF"/>
<text x="538" y="323" font-size="13" fill="#1F2D3D" text-anchor="start" font-weight="700" >Entraînement</text><text x="567" y="344" font-size="11" fill="#5D6C73" text-anchor="middle" font-weight="400" >sert à entraîner ?</text>
<path d="M430 224 L430 246" stroke="#BA8748" stroke-width="2" stroke-dasharray="4 4"/><path d="M426.1 237.9 L430 246 L433.9 237.9" fill="none" stroke="#BA8748" stroke-width="2" stroke-linejoin="round"/>
<text x="400" y="396" font-size="13" fill="#3B4B5E" text-anchor="middle" font-weight="400" >« Pas d'entraînement » ne veut pas dire « pas de conservation ».</text>
</svg>