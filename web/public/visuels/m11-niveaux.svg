<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif">
<title id="t">Les quatre niveaux de risque de l'AI Act</title><desc id="d">Pyramide à quatre étages. À la base, le risque minimal, qui couvre la grande majorité des usages. Au-dessus, la transparence, puis le haut risque, et au sommet les usages interdits. Un exemple est donné pour chaque niveau.</desc>
<rect width="800" height="440" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">LE NIVEAU DÉPEND DE L'USAGE</text>
<polygon points="250,70.0 302.5,149.5 197.5,149.5" fill="#B4473D"/>
<text x="250" y="123.2" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700">Interdit</text>
<path d="M291.9 123.2 L500 123.2" stroke="#B4473D" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="500" cy="123.2" r="4" fill="#B4473D"/>
<text x="514" y="109.2" font-size="11" fill="#B4473D" font-weight="700" letter-spacing="1" font-family="'JetBrains Mono',Consolas,monospace">ARTICLE 5</text>
<text x="514" y="127.2" font-size="13" fill="#1F2D3D">Déduire les émotions d'un salarié,</text>
<text x="514" y="144.2" font-size="13" fill="#1F2D3D">notation sociale, manipulation</text>
<polygon points="200.5,155.5 299.5,155.5 355.0,232.0 145.0,232.0" fill="#BA8748"/>
<text x="250" y="198.8" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Haut risque</text>
<path d="M336.8 193.8 L500 193.8" stroke="#BA8748" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="500" cy="193.8" r="4" fill="#BA8748"/>
<text x="514" y="179.8" font-size="11" fill="#BA8748" font-weight="700" letter-spacing="1" font-family="'JetBrains Mono',Consolas,monospace">OBLIGATIONS LOURDES</text>
<text x="514" y="197.8" font-size="13" fill="#1F2D3D">Recrutement, évaluation des salariés,</text>
<text x="514" y="214.8" font-size="13" fill="#1F2D3D">sécurité d'une machine</text>
<polygon points="148.0,238.0 352.0,238.0 407.5,314.5 92.5,314.5" fill="#7C9E98"/>
<text x="250" y="281.2" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Transparence</text>
<path d="M389.2 276.2 L500 276.2" stroke="#7C9E98" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="500" cy="276.2" r="4" fill="#7C9E98"/>
<text x="514" y="262.2" font-size="11" fill="#5E807A" font-weight="700" letter-spacing="1" font-family="'JetBrains Mono',Consolas,monospace">ARTICLE 50</text>
<text x="514" y="280.2" font-size="13" fill="#1F2D3D">Agent qui répond aux clients,</text>
<text x="514" y="297.2" font-size="13" fill="#1F2D3D">image ou voix réalistes générées</text>
<polygon points="95.5,320.5 404.5,320.5 460.0,397.0 40.0,397.0" fill="#00B194"/>
<text x="250" y="363.8" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="700">Risque minimal</text>
<path d="M441.8 358.8 L500 358.8" stroke="#00B194" stroke-width="1.5" stroke-dasharray="3 4"/>
<circle cx="500" cy="358.8" r="4" fill="#00B194"/>
<text x="514" y="344.8" font-size="11" fill="#00B194" font-weight="700" letter-spacing="1" font-family="'JetBrains Mono',Consolas,monospace">LA GRANDE MAJORITÉ</text>
<text x="514" y="362.8" font-size="13" fill="#1F2D3D">Mail, synthèse de CCTP,</text>
<text x="514" y="379.8" font-size="13" fill="#1F2D3D">extraction d'un devis, fiche</text>
</svg>