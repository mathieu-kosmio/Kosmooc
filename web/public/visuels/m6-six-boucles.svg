<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Les six boucles de prototypage</title><desc id="d">Un cycle : exemple réel, sortie attendue, version V0, comparer, transformer chaque erreur en règle, retester. La boucle 5 est mise en avant.</desc>
<rect width="800" height="420" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">LES SIX BOUCLES DE PROTOTYPAGE</text>
<circle cx="230" cy="236" r="118" fill="none" stroke="#C9BFB1" stroke-width="2"/>
<circle cx="230.0" cy="118.0" r="24" fill="#00B194"/><text x="230.0" y="124.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700" >1</text>
<text x="230.0" y="80.0" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Exemple réel</text>
<path d="M262.6 122.6 A118 118 0 0 1 311.9 151.1" fill="none" stroke="#00B194" stroke-width="3"/>
<path d="M304.2 148.9 L311.9 151.1 L309.5 143.4" fill="none" stroke="#00B194" stroke-width="3"/>
<circle cx="332.2" cy="177.0" r="24" fill="#00B194"/><text x="332.2" y="183.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700" >2</text>
<text x="368.2" y="182.0" font-size="13" fill="#1F2D3D" text-anchor="start" font-weight="600" >Sortie attendue</text>
<path d="M344.5 207.5 A118 118 0 0 1 344.5 264.5" fill="none" stroke="#00B194" stroke-width="3"/>
<path d="M342.5 256.7 L344.5 264.5 L349.9 258.6" fill="none" stroke="#00B194" stroke-width="3"/>
<circle cx="332.2" cy="295.0" r="24" fill="#00B194"/><text x="332.2" y="301.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700" >3</text>
<text x="368.2" y="300.0" font-size="13" fill="#1F2D3D" text-anchor="start" font-weight="600" >Version V0</text>
<path d="M311.9 320.9 A118 118 0 0 1 262.6 349.4" fill="none" stroke="#00B194" stroke-width="3"/>
<path d="M268.3 343.8 L262.6 349.4 L270.4 351.2" fill="none" stroke="#00B194" stroke-width="3"/>
<circle cx="230.0" cy="354.0" r="24" fill="#00B194"/><text x="230.0" y="360.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700" >4</text>
<text x="230.0" y="402.0" font-size="13" fill="#1F2D3D" text-anchor="middle" font-weight="600" >Comparer</text>
<path d="M197.4 349.4 A118 118 0 0 1 148.1 320.9" fill="none" stroke="#00B194" stroke-width="3"/>
<path d="M155.8 323.1 L148.1 320.9 L150.5 328.6" fill="none" stroke="#00B194" stroke-width="3"/>
<circle cx="127.8" cy="295.0" r="30" fill="#BA8748"/><text x="127.8" y="301.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700" >5</text>
<text x="91.8" y="300.0" font-size="13" fill="#BA8748" text-anchor="end" font-weight="700" >Erreur → règle</text>
<path d="M115.5 264.5 A118 118 0 0 1 115.5 207.5" fill="none" stroke="#00B194" stroke-width="3"/>
<path d="M117.5 215.3 L115.5 207.5 L110.1 213.4" fill="none" stroke="#00B194" stroke-width="3"/>
<circle cx="127.8" cy="177.0" r="24" fill="#00B194"/><text x="127.8" y="183.0" font-size="17" fill="#FFFFFF" text-anchor="middle" font-weight="700" >6</text>
<text x="91.8" y="182.0" font-size="13" fill="#1F2D3D" text-anchor="end" font-weight="600" >Retester</text>
<path d="M148.1 151.1 A118 118 0 0 1 197.4 122.6" fill="none" stroke="#00B194" stroke-width="3"/>
<path d="M191.7 128.2 L197.4 122.6 L189.6 120.8" fill="none" stroke="#00B194" stroke-width="3"/>
<text x="230" y="232" font-size="14" fill="#5D6C73" text-anchor="middle" font-weight="400" >test</text><text x="230" y="252" font-size="14" fill="#5D6C73" text-anchor="middle" font-weight="400" >erreur, règle</text>
<text x="492" y="110" font-size="17" fill="#BA8748" text-anchor="start" font-weight="700" >La boucle 5 est la vôtre</text>
<text x="492" y="140" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >C'est là que votre savoir-faire</text>
<text x="492" y="161" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >entre dans l'outil :</text>
<text x="492" y="182" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" ></text>
<text x="492" y="203" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >« DOU » désigne du douglas chez nous.</text>
<text x="492" y="224" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >« idem ci-dessus » reprend l'essence</text>
<text x="492" y="245" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >de la ligne précédente.</text>
<text x="492" y="266" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" ></text>
<text x="492" y="287" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >Chaque erreur devient une règle écrite,</text>
<text x="492" y="308" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >datée, transportable.</text>
</svg>