<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" role="img" aria-labelledby="t d" font-family="'Helvetica Neue',Helvetica,Arial,sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Le harnais autour du modèle</title><desc id="d">Le modèle au centre, entouré de six éléments : règles, savoir-faire, gabarits, outils, contrôle qualité, validation humaine.</desc>
<rect width="800" height="380" rx="16" fill="#FBF6EE"/>
<text x="32" y="40" font-size="11" fill="#009982" text-anchor="start" font-weight="700" letter-spacing="1.4" font-family="'JetBrains Mono',Consolas,monospace">LE HARNAIS</text>
<path d="M264.7 44.1 A156 156 0 0 1 392.7 118.0 L321.2 162.1 A72 72 0 0 0 262.2 128.0 Z" fill="#00B194" opacity="0.92"/>
<text x="317.0" y="106.3" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Règles</text>
<path d="M397.4 126.1 A156 156 0 0 1 397.4 273.9 L323.4 234.1 A72 72 0 0 0 323.4 165.9 Z" fill="#009982" opacity="0.92"/>
<text x="374.0" y="205.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Savoir-faire</text>
<path d="M392.7 282.0 A156 156 0 0 1 264.7 355.9 L262.2 272.0 A72 72 0 0 0 321.2 237.9 Z" fill="#7C9E98" opacity="0.92"/>
<text x="317.0" y="303.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Gabarits</text>
<path d="M255.3 355.9 A156 156 0 0 1 127.3 282.0 L198.8 237.9 A72 72 0 0 0 257.8 272.0 Z" fill="#65857F" opacity="0.92"/>
<text x="203.0" y="303.7" font-size="13" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Outils</text>
<path d="M122.6 273.9 A156 156 0 0 1 122.6 126.1 L196.6 165.9 A72 72 0 0 0 196.6 234.1 Z" fill="#BA8748" opacity="0.92"/>
<text x="146.0" y="197.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Contrôle</text><text x="146.0" y="212.0" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" >qualité</text>
<path d="M127.3 118.0 A156 156 0 0 1 255.3 44.1 L257.8 128.0 A72 72 0 0 0 198.8 162.1 Z" fill="#9F7338" opacity="0.92"/>
<text x="203.0" y="98.3" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" >Validation</text><text x="203.0" y="113.3" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="700" >humaine</text>
<circle cx="260" cy="200" r="66" fill="#FFFFFF" stroke="#1F2D3D" stroke-width="2"/>
<text x="260" y="194" font-size="15" fill="#1F2D3D" text-anchor="middle" font-weight="700" >Le modèle</text><text x="260" y="214" font-size="12" fill="#5D6C73" text-anchor="middle" font-weight="400" >(changeable)</text>
<text x="470" y="110" font-size="17" fill="#1F2D3D" text-anchor="start" font-weight="700" >Un intérimaire brillant</text>
<text x="470" y="140" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >Il sait lire, écrire, calculer.</text>
<text x="470" y="161" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >Il ignore vos essences, vos gabarits,</text>
<text x="470" y="182" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >vos exceptions, vos clients.</text>
<text x="470" y="203" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" ></text>
<text x="470" y="224" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >Le harnais, c'est tout ce qui l'entoure</text>
<text x="470" y="245" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >pour qu'il travaille comme un ancien.</text>
<text x="470" y="266" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" ></text>
<text x="470" y="287" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >Il vous appartient : si vous changez</text>
<text x="470" y="308" font-size="14" fill="#3B4B5E" text-anchor="start" font-weight="400" >de modèle, le harnais reste.</text>
</svg>